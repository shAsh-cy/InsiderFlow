name: Nightly analytics

# Derived analytics: SIC→sector enrichment, congressional PTR ingestion,
# price-history gap fill, forward-return scoring, net-flow anomaly baselines,
# and the cluster-flag repair sweep.
#
# WHY HERE AND NOT ON THE WORKER CRON: the Cloudflare worker already uses two
# of its five free triggers, and none of this work has a 60-second SLA. Several
# steps pull tens of megabytes or make hundreds of rate-limited requests, which
# is a poor fit for a per-minute Worker invocation and a natural fit for a
# scheduled Action.
#
# Requires repo secrets: DATABASE_URL, EDGAR_USER_AGENT.
on:
  schedule:
    # 03:20 UTC — after the US market close has settled into the price feeds
    # and well outside the EDGAR daily-index publication window.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated steps (sectors,politicians,prices,scoring,anomalies,clusters)"
        required: false
        default: ""
      sectorLimit:
        description: "Companies to enrich this run"
        required: false
        default: "300"
      priceLimit:
        description: "Symbols to backfill price history for this run"
        required: false
        default: "60"

concurrency:
  # Never let two nightly runs write the same derived tables at once.
  group: nightly-analytics
  cancel-in-progress: false

jobs:
  analytics:
    # Gated on the repository variable DEPLOYMENT_ACTIVE (see README).
    # Unset or anything but 'true' and this job is SKIPPED, not failed: with
    # no production database the nightly cannot do anything, and eight red
    # runs a week for "the deployment does not exist yet" trains everyone to
    # ignore the one that means something.
    if: ${{ vars.DEPLOYMENT_ACTIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ── WHY THE GUARD IS A STEP AND THE GATE IS A VARIABLE ─────────
      #
      # `secrets.*` is not readable in a job-level `if:` — GitHub rejects it
      # at parse time with "Unrecognized named-value: 'secrets'", and the
      # whole workflow errors rather than skipping. `vars.*` IS allowed
      # there, so the repository variable DEPLOYMENT_ACTIVE gates the job
      # and this step gates the work inside it.
      #
      # The secret is read through the environment rather than interpolated
      # into the script body. `${{ secrets.X }}` inside a `run:` is expanded
      # before the shell sees it, so a syntax error or an `set -x` would
      # print the credential into a public run log; `$X` from `env:` cannot.
      - name: Check for the deployment secrets
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice title=Nothing to do::DEPLOYMENT_ACTIVE is true but DATABASE_URL is empty, so there is no database to talk to. Exiting 0."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run nightly analytics
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          # Optional: the bundled congressional sources are offline
          # (docs/politicians.md). Set these to any source you have rights to.
          HOUSE_PTR_URL: ${{ secrets.HOUSE_PTR_URL }}
          SENATE_PTR_URL: ${{ secrets.SENATE_PTR_URL }}
        # `run` is required, not optional: with the implicit form
        # (`pnpm --filter X nightly -- --only=...`) pnpm swallows `--only` as
        # one of its own flags and the script silently receives nothing.
        run: >
          pnpm --filter @insiderflow/analytics run nightly --
          --only=${{ github.event.inputs.only }}
          --sectorLimit=${{ github.event.inputs.sectorLimit || '300' }}
          --priceLimit=${{ github.event.inputs.priceLimit || '60' }}
