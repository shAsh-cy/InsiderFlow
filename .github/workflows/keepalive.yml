name: Supabase keep-alive

# WHY THIS EXISTS: Supabase pauses free projects after 7 consecutive days with
# no database activity. A paused project answers with HTTP 540 and stays down
# until someone clicks "Restore" in the dashboard — which means a low-traffic
# deployment silently dies about a week after launch, and the first person to
# notice is a visitor.
#
# A trivial query twice a week resets that timer. This is the single most
# load-bearing workflow in the repo for a free-tier deploy, and the cheapest.
#
# It is a no-op on paid plans and on any non-Supabase Postgres (Neon, Fly,
# self-hosted); harmless to leave enabled either way.
#
# Requires repo secret: DATABASE_URL.
on:
  schedule:
    # Sunday and Wednesday — two touches a week means one can fail entirely
    # and the 7-day timer still never expires.
    - cron: "17 6 * * 0"
    - cron: "17 6 * * 3"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    # NOT in the original brief, and gated for the same reason as the rest:
    # this was failing twice a week against a Supabase project that does not
    # exist yet. It is the workflow that matters MOST once the deployment is
    # real — a paused free project answers HTTP 540 until someone clicks
    # Restore — so it must come back on the moment DEPLOYMENT_ACTIVE flips,
    # and it does, with no other edit.
    if: ${{ vars.DEPLOYMENT_ACTIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── WHY THE GUARD IS A STEP AND THE GATE IS A VARIABLE ─────────
      #
      # `secrets.*` is not readable in a job-level `if:` — GitHub rejects it
      # at parse time with "Unrecognized named-value: 'secrets'", and the
      # whole workflow errors rather than skipping. `vars.*` IS allowed
      # there, so the repository variable DEPLOYMENT_ACTIVE gates the job
      # and this step gates the work inside it.
      #
      # The secret is read through the environment rather than interpolated
      # into the script body. `${{ secrets.X }}` inside a `run:` is expanded
      # before the shell sees it, so a syntax error or an `set -x` would
      # print the credential into a public run log; `$X` from `env:` cannot.
      - name: Check for the deployment secrets
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice title=Nothing to do::DEPLOYMENT_ACTIVE is true but DATABASE_URL is empty, so there is no database to talk to. Exiting 0."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Touch the database
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @insiderflow/db run keepalive

      # A silent failure here is exactly the outcome this workflow exists to
      # prevent, so make it loud.
      # Both halves, in one expression: a duplicate `if:` key is not an
      # error YAML reports — the last one silently wins — so a skipped run
      # would have tried to page the ops chat about a database it was never
      # going to touch.
      - name: Report failure to the ops chat
        if: failure() && steps.preflight.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPS_TELEGRAM_CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$OPS_TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${OPS_TELEGRAM_CHAT_ID}" \
              -d "text=⚠️ InsiderFlow: Supabase keep-alive FAILED. The project may pause after 7 idle days (HTTP 540). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null || true
          fi
