name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `pnpm lint` is `pnpm -r lint`, and pnpm's -r skips the root project.
      # The five scripts that ENFORCE the gates below therefore linted
      # nowhere, which is how a reference to a variable renamed out of
      # existence shipped inside the EDGAR latency gate's failure branch.
      - name: Lint the gate scripts
        run: pnpm lint:scripts

      # The project-specific gates. Each exists because something got past
      # the generic ones: a missing changelog section, a class selector
      # standing in for a component, and a status array that accepted the
      # exploitable answer. The fourth is the odd one out — it was added
      # while the tree was already clean, to keep it that way: schemas are
      # shared, handlers are not, and a new route is a one-file change that
      # never opens schemas.ts. None of them run unless CI runs them.
      - name: Lint the changelog
        run: pnpm lint:changelog

      - name: Lint e2e locators
        run: pnpm lint:e2e-locators

      - name: Lint e2e assertions
        run: pnpm lint:e2e-assertions

      - name: Lint API input validation
        run: pnpm lint:api-schemas

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # AFTER the build, because it scans the build output. `.next/static`
      # is what every visitor downloads, so a key that lands there is
      # disclosed rather than merely at risk — and only NEXT_PUBLIC_ values
      # are inlined, which makes this a narrow mistake to make and a total
      # one to suffer.
      - name: No secrets in the client bundle
        run: pnpm lint:client-bundle

  # THE SUITE THAT HAD ONLY EVER RUN ON A LAPTOP.
  #
  # 355 tests across four projects, and until this job none of them had ever
  # run anywhere except one developer's machine. That is the same defect r15
  # found in the Lighthouse numbers and r16 found in the a11y bar: a gate
  # that exists, is real, and gates nothing, because nothing automated runs
  # it. Everything below is what it takes to make it run from a clean
  # checkout.
  #
  # SEPARATE JOB, not more steps on `ci`. It needs Docker, a database, a
  # browser and a full production build; the `ci` job is minutes and this is
  # tens of minutes. Bolted together, every typo would wait for Chromium.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Generous on purpose: a cold production build is minutes before the
    # first test runs, and the suite is capped at two workers (below).
    timeout-minutes: 60

    env:
      # Port 5433, not 5432 — that is what docker-compose.yml publishes, and
      # this job deliberately uses the committed compose file rather than its
      # own definition of the database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/insiderflow
      # The suite asserts against the reserved ZZ* fixtures, which are hidden
      # by default so synthetic rows can never reach a real deployment's
      # analytics. playwright.config.ts sets this for the server it manages;
      # it is set here too for the migrate/seed/analytics steps.
      INSIDERFLOW_SHOW_SYNTHETIC: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WHY `docker compose` AND NOT A `services:` BLOCK.
      #
      # `e2e/global-setup.ts` and `e2e/fixtures.ts` both reach the database
      # as `docker exec insiderflow-postgres psql`. Actions service
      # containers get a generated name, so `docker exec insiderflow-postgres`
      # does not resolve and every fixture in the suite fails — which is
      # exactly what the r16 `quality.yml` would have done had it ever run.
      #
      # The alternative was to rewrite `psql()` to use a client library, and
      # that is the wrong trade: the pre-flight's whole value is that it
      # checks the database over THE SAME PATH the fixtures use, so a
      # container that is up but unreachable that way fails in the pre-flight
      # rather than inside the first fixture that needs it. Using the
      # committed compose file keeps CI and a developer's machine on one
      # path, and gets the compose definition exercised on every PR as a
      # side effect.
      - name: Start Postgres (the same container the fixtures talk to)
        run: docker compose up -d --wait postgres

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm seed

      # Migrations and the seed leave every DERIVED table empty, and the
      # heatmap, the two analytics screener presets and the leaderboard read
      # only those. docker-compose.yml runs this step for the same reason and
      # calls it not optional. Offline steps only — `sectors`, `politicians`
      # and `prices` call EDGAR, congressional feeds and Stooq, and a CI run
      # must not depend on three third parties being reachable.
      - name: Derived analytics (offline steps only)
        run: pnpm --filter @insiderflow/analytics run nightly -- --only=clusters,scoring,anomalies

      - name: Install Playwright chromium
        run: pnpm --filter @insiderflow/web exec playwright install --with-deps chromium

      # Builds and starts its own production server on :3100 — `reuseExisting
      # Server` is false under CI, so there is nothing stale to inherit. Two
      # workers, per the r12 measurement: eight oversubscribed the machine and
      # failed a different handful of tests every run.
      #
      # Specs that need credentials this runner has not got — the Telegram
      # webhook positive case, the Supabase cross-user isolation block —
      # SKIP with a printed reason rather than passing quietly. Read the
      # skip count in this step's log; a skip is an uncovered case, not a
      # green one.
      - name: Run the suite
        run: pnpm test:e2e

      # `trace: on-first-retry` with `retries: 2` under CI, so a test that
      # fails twice leaves a trace. Without this they are deleted with the
      # runner and a CI-only failure has to be guessed at.
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn

  # A required check, not a nicety. `.dockerignore` once used bare `.env` /
  # `.env.*` patterns, which match only the build-context root — so
  # `apps/web/.env.local` was copied into the image and auto-loaded by Next at
  # runtime, shipping a live bot token and silently overriding the container's
  # config. Reviewing the ignore file is what failed; scanning the artefact is
  # what catches it. See docs/security.md.
  image-secret-scan:
    name: No secrets in the built image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plant the exact files the leak shipped. If .dockerignore regresses, the
      # scan below fails on a real path rather than on a hypothetical one — a
      # clean checkout has no env files, so without this the test proves
      # nothing.
      - name: Plant decoy secret files
        run: |
          printf 'TELEGRAM_BOT_TOKEN=ci-decoy-must-not-ship\n' > apps/web/.env.local
          printf 'TELEGRAM_BOT_TOKEN=ci-decoy-must-not-ship\n' > .env
          printf 'TELEGRAM_BOT_TOKEN=ci-decoy-must-not-ship\n' > ingestion/edgar-worker/.dev.vars

      - name: Build image
        run: docker build --target web -t insiderflow-web:ci .

      - name: Assert no env or secret files inside the image
        run: |
          found=$(docker run --rm --entrypoint sh insiderflow-web:ci -c \
            'find /app -name ".env" -o -name ".env.*" ! -name ".env.example" -o -name ".dev.vars" 2>/dev/null')
          if [ -n "$found" ]; then
            echo "::error::Secret-bearing files found inside the image:"
            echo "$found"
            exit 1
          fi
          echo "OK: no .env / .dev.vars files in the image"

      # Belt and braces: the decoy value must not appear anywhere in the
      # filesystem, even under a name the find above does not cover.
      - name: Assert the decoy value is absent from the image filesystem
        run: |
          if docker run --rm --entrypoint sh insiderflow-web:ci -c \
              'grep -rl "ci-decoy-must-not-ship" /app 2>/dev/null | head -5' | grep -q .; then
            echo "::error::Decoy secret value present inside the image"
            exit 1
          fi
          echo "OK: decoy value absent"
