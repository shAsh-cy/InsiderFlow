name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The project-specific gates. Each exists because something got past
      # the generic ones: a missing changelog section, a class selector
      # standing in for a component, and a status array that accepted the
      # exploitable answer. The fourth is the odd one out — it was added
      # while the tree was already clean, to keep it that way: schemas are
      # shared, handlers are not, and a new route is a one-file change that
      # never opens schemas.ts. None of them run unless CI runs them.
      - name: Lint the changelog
        run: pnpm lint:changelog

      - name: Lint e2e locators
        run: pnpm lint:e2e-locators

      - name: Lint e2e assertions
        run: pnpm lint:e2e-assertions

      - name: Lint API input validation
        run: pnpm lint:api-schemas

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # AFTER the build, because it scans the build output. `.next/static`
      # is what every visitor downloads, so a key that lands there is
      # disclosed rather than merely at risk — and only NEXT_PUBLIC_ values
      # are inlined, which makes this a narrow mistake to make and a total
      # one to suffer.
      - name: No secrets in the client bundle
        run: pnpm lint:client-bundle

  # A required check, not a nicety. `.dockerignore` once used bare `.env` /
  # `.env.*` patterns, which match only the build-context root — so
  # `apps/web/.env.local` was copied into the image and auto-loaded by Next at
  # runtime, shipping a live bot token and silently overriding the container's
  # config. Reviewing the ignore file is what failed; scanning the artefact is
  # what catches it. See docs/security.md.
  image-secret-scan:
    name: No secrets in the built image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plant the exact files the leak shipped. If .dockerignore regresses, the
      # scan below fails on a real path rather than on a hypothetical one — a
      # clean checkout has no env files, so without this the test proves
      # nothing.
      - name: Plant decoy secret files
        run: |
          printf 'TELEGRAM_BOT_TOKEN=ci-decoy-must-not-ship\n' > apps/web/.env.local
          printf 'TELEGRAM_BOT_TOKEN=ci-decoy-must-not-ship\n' > .env
          printf 'TELEGRAM_BOT_TOKEN=ci-decoy-must-not-ship\n' > ingestion/edgar-worker/.dev.vars

      - name: Build image
        run: docker build --target web -t insiderflow-web:ci .

      - name: Assert no env or secret files inside the image
        run: |
          found=$(docker run --rm --entrypoint sh insiderflow-web:ci -c \
            'find /app -name ".env" -o -name ".env.*" ! -name ".env.example" -o -name ".dev.vars" 2>/dev/null')
          if [ -n "$found" ]; then
            echo "::error::Secret-bearing files found inside the image:"
            echo "$found"
            exit 1
          fi
          echo "OK: no .env / .dev.vars files in the image"

      # Belt and braces: the decoy value must not appear anywhere in the
      # filesystem, even under a name the find above does not cover.
      - name: Assert the decoy value is absent from the image filesystem
        run: |
          if docker run --rm --entrypoint sh insiderflow-web:ci -c \
              'grep -rl "ci-decoy-must-not-ship" /app 2>/dev/null | head -5' | grep -q .; then
            echo "::error::Decoy secret value present inside the image"
            exit 1
          fi
          echo "OK: decoy value absent"
