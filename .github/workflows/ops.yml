name: Ops

# Two scheduled safety nets that do NOT belong on the Cloudflare worker:
#
#  - digest backstop: the worker's hourly cron is the primary digest runner
#    (it is what makes per-user local digest hours work). This catches the case
#    where the worker was down, over quota, or mid-deploy at someone's digest
#    hour. Safe to run alongside it because both take the same lease — without
#    that they would send the same batch twice.
#
#  - ops check: pushes a message to an ops Telegram chat when a background job
#    is behind. Separate from /api/health's status code on purpose: an uptime
#    monitor should page when the SITE is down; this nudges when a JOB is
#    behind. Conflating the two is how pagers get muted.
#
# GitHub Actions schedules are per-workflow, so both crons live here and each
# job filters on which one fired.
#
# Requires repo secrets: DATABASE_URL. Optional: TELEGRAM_BOT_TOKEN,
# OPS_TELEGRAM_CHAT_ID, RESEND_API_KEY, RESEND_FROM, SITE_URL.
on:
  schedule:
    # Digest backstop — after the US market close has settled.
    - cron: "40 23 * * *"
    # Ops check — every 6 hours. Frequent enough to catch a stuck cron the
    # same day, rare enough that a healthy week is silent.
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: "ops-check"
        type: choice
        options: [ops-check, digest]

concurrency:
  group: insiderflow-ops
  cancel-in-progress: false

jobs:
  digest:
    # DEPLOYMENT_ACTIVE (a repository VARIABLE, see README) is ANDed with the
    # existing schedule filter. Both halves matter: the schedule decides which
    # of this workflow's two crons fired, the variable decides whether there
    # is a deployment for it to act on.
    if: ${{ vars.DEPLOYMENT_ACTIVE == 'true' && (github.event.schedule == '40 23 * * *' || github.event.inputs.job == 'digest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ── WHY THE GUARD IS A STEP AND THE GATE IS A VARIABLE ─────────
      #
      # `secrets.*` is not readable in a job-level `if:` — GitHub rejects it
      # at parse time with "Unrecognized named-value: 'secrets'", and the
      # whole workflow errors rather than skipping. `vars.*` IS allowed
      # there, so the repository variable DEPLOYMENT_ACTIVE gates the job
      # and this step gates the work inside it.
      #
      # The secret is read through the environment rather than interpolated
      # into the script body. `${{ secrets.X }}` inside a `run:` is expanded
      # before the shell sees it, so a syntax error or an `set -x` would
      # print the credential into a public run log; `$X` from `env:` cannot.
      - name: Check for the deployment secrets
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice title=Nothing to do::DEPLOYMENT_ACTIVE is true but DATABASE_URL is empty, so there is no database to talk to. Exiting 0."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.ready == 'true'
      - name: Flush any pending digests
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: pnpm --filter @insiderflow/analytics run digest

  ops-check:
    if: ${{ vars.DEPLOYMENT_ACTIVE == 'true' && (github.event.schedule == '5 */6 * * *' || github.event.inputs.job == 'ops-check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── WHY THE GUARD IS A STEP AND THE GATE IS A VARIABLE ─────────
      #
      # `secrets.*` is not readable in a job-level `if:` — GitHub rejects it
      # at parse time with "Unrecognized named-value: 'secrets'", and the
      # whole workflow errors rather than skipping. `vars.*` IS allowed
      # there, so the repository variable DEPLOYMENT_ACTIVE gates the job
      # and this step gates the work inside it.
      #
      # The secret is read through the environment rather than interpolated
      # into the script body. `${{ secrets.X }}` inside a `run:` is expanded
      # before the shell sees it, so a syntax error or an `set -x` would
      # print the credential into a public run log; `$X` from `env:` cannot.
      - name: Check for the deployment secrets
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice title=Nothing to do::DEPLOYMENT_ACTIVE is true but DATABASE_URL is empty, so there is no database to talk to. Exiting 0."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.ready == 'true'
      - name: Check pipeline health
        if: steps.preflight.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPS_TELEGRAM_CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
        # Exits 0 even when degraded — a red run for "EDGAR was quiet
        # overnight" is noise, and the Telegram message is the real signal.
        run: pnpm --filter @insiderflow/analytics run ops-check
