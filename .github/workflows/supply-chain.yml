name: Supply chain

# OWASP 2025 A03 — software supply chain failures, community-ranked the
# number one risk. The dependency tree is where a project like this one is
# most likely to be compromised without anybody touching its source, and
# it is the part that changes while nobody is looking. So it is checked on
# every pull request AND on a schedule: a lockfile that was clean when it
# merged is not clean forever, and nothing in a PR-only gate ever notices
# an advisory published the week after.
#
# Three scanners, deliberately not one:
#
#   osv-scanner  reads the lockfile against OSV, which aggregates GHSA,
#                the Go and Rust advisory DBs and others. It scans EVERY
#                dependency, dev included.
#   pnpm audit   reads the GitHub Advisory Database through npm's own
#                endpoint. Run at both scopes on purpose — `--prod` is
#                what ships, the unscoped run is what a contributor
#                installs. During r12 the unscoped run and osv-scanner
#                both found six dev-only advisories that `--prod` alone
#                reported as clean.
#   gitleaks     is a different question entirely: not "is a dependency
#                vulnerable" but "did we commit a credential".

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC daily. Not on the hour: every scheduled workflow on GitHub
    # fires at :00 and the queue is worst there.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # SARIF upload writes into the repository's code-scanning alerts, so
      # a finding becomes a tracked alert with a history rather than a line
      # in a log that scrolls away.
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan the lockfile
        # Pinned to a tag rather than a moving major: a supply-chain gate
        # that silently updates itself is the thing it exists to prevent.
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.4
        id: osv
        continue-on-error: true
        with:
          scan-args: |-
            --format=sarif
            --output=osv-results.sarif
            --lockfile=pnpm-lock.yaml

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      # The upload must happen even when the scan finds something, so the
      # alerts appear — and the job must still fail, or it is advisory.
      - name: Fail if the scan found anything
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::osv-scanner found known vulnerabilities — see the Security tab."
          exit 1

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production first and separately, so a failure names which scope
      # broke. A dev-only advisory is a different conversation from one in
      # the shipped bundle, and a single combined run hides that.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=low

      - name: Audit every dependency
        run: pnpm audit --audit-level=low

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # ── THE BINARY, NOT THE ACTION ────────────────────────────────────
    #
    # `gitleaks/gitleaks-action@v2` was failing every run. It is free only
    # for a single personal repository and requires a paid GITLEAKS_LICENSE
    # for organisation-owned ones, and it phones home to check — so the job
    # fails on licensing rather than on anything about this codebase. The
    # gitleaks CLI it wraps is MIT-licensed and has no such condition.
    #
    # Pinned to an exact version and checksum-verified. A supply-chain
    # workflow that pulls an unpinned binary over the network and runs it
    # is not in a position to lecture anyone about dependencies.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and then "removed" in
          # a later commit is still in the pack, still clonable, and still
          # a live credential. Scanning only the tip finds nothing.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # A broken .gitleaks.toml is indistinguishable from a clean scan if
      # nothing checks it: gitleaks would refuse to start and the job would
      # report whatever the shell did next. Scanning an empty directory
      # exercises the config and nothing else.
      - name: Verify .gitleaks.toml parses
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-empty
          if ! gitleaks dir /tmp/gitleaks-empty --config .gitleaks.toml --no-banner --exit-code 2; then
            echo "::error title=gitleaks config::.gitleaks.toml did not parse. Fix the config; this is not a leak."
            exit 1
          fi
          echo "OK: .gitleaks.toml parses"

      - name: Scan the full history and the working tree
        run: |
          set -uo pipefail

          # `--exit-code 2` is the load-bearing flag, and it is why this is
          # a script rather than two plain invocations.
          #
          # By default gitleaks exits 1 when it finds a secret — but it also
          # exits 1 when it cannot read a config, cannot open the repo, or
          # fails for any other reason. Those two are opposite outcomes: one
          # means "there is a credential in this repository", the other means
          # "this check did not run". Collapsing them into the same exit code
          # means a scanner that silently stopped working reads exactly like
          # a scanner that is passing. Moving LEAKS to 2 leaves every other
          # nonzero code meaning "the tool failed", which is a distinction
          # the log can then state.
          scan() {
            mode="$1"; shift
            echo "── gitleaks ${mode} ──────────────────────────────────────"
            gitleaks "$mode" "$@" --config .gitleaks.toml --redact -v --no-banner --exit-code 2
            rc=$?
            case "$rc" in
              0) echo "OK: no findings (${mode})" ;;
              2) echo "::error title=Secret committed::gitleaks found a credential in ${mode} mode. The finding above is redacted — the value itself is in the repository. Rotate it first, then remove it from history."
                 exit 1 ;;
              *) echo "::error title=gitleaks did not run::gitleaks exited ${rc} in ${mode} mode. That is a tool or config failure, NOT a clean scan — this job is failing so it cannot be mistaken for one."
                 exit 1 ;;
            esac
          }

          # History, then the working tree. `git` mode walks every commit in
          # the pack; `dir` mode reads the files as they are on disk, which
          # catches anything staged-but-uncommitted in a PR checkout and
          # anything a .gitignore is hiding from git mode.
          scan git .
          scan dir .
